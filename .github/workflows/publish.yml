name: publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version
        id: version
        run: |
          current=$(grep '^version=' gradle.properties | cut -d= -f2)
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)

          if [ -z "$previous" ] || [ "$previous" != "$current" ]; then
            echo "version differs from the last release (${previous:-none}): using $current"
            version="$current"
          else
            if ! echo "$current" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "cannot auto-bump '$current'; set the version by hand" >&2
              exit 1
            fi
            IFS=. read -r major minor patch <<< "$current"
            version="$major.$minor.$((patch + 1))"
            echo "version not edited: bumped $current -> $version"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists; bump the version by hand" >&2
            exit 1
          fi

          bash .github/scripts/sync-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish to Maven Central
        run: ./gradlew :all:publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Push version to main and production
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .

          for branch in main production; do
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            bash .github/scripts/sync-version.sh "$VERSION"
            git add gradle.properties README.md
            if ! git diff --cached --quiet; then
              git commit -m "chore: release v$VERSION [skip ci]"
              git push origin "$branch"
            fi
          done

          git tag "v$VERSION"
          git push origin "v$VERSION"
